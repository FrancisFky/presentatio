# Intégration et déploiement continus du site de l'Ambassade (repris de YaQo).
#
# À chaque push : les assets sont compilés et toute la suite de tests tourne.
# Sur main, si tout est vert, le site part en production par SSH sur un
# hébergement cPanel (voir docs/deploiement.md pour les variables à renseigner).

stages:
  - build
  - test
  - deploy

variables:
  # Même version que le serveur de production
  PHP_IMAGE: php:8.4-cli
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# PHP avec les extensions du projet (images WebP, dates en français…)
.php:
  image: $PHP_IMAGE
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip rsync openssh-client curl > /dev/null
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions
    - install-php-extensions gd zip intl bcmath exif pcntl pdo_mysql @composer > /dev/null
  cache:
    key:
      files: [composer.lock]
    paths: [.cache/composer]

assets:
  stage: build
  image: node:22-bookworm-slim
  script:
    - npm ci --no-audit --no-fund
    - npm run build
  cache:
    key:
      files: [package-lock.json]
    paths: [.cache/npm]
  artifacts:
    paths: [public/build]
    expire_in: 1 week

tests:
  stage: test
  extends: .php
  needs: [assets]
  script:
    - composer install --no-interaction --prefer-dist --no-progress
    - cp .env.example .env
    - php artisan key:generate
    # phpunit.xml : SQLite en mémoire, aucun service externe
    - php artisan test

deploy:
  stage: deploy
  extends: .php
  needs: [assets, tests]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: $APP_URL
  resource_group: production
  script:
    - composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
    - bash scripts/deploy.sh
